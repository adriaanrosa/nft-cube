<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Frontend Mentor | NFT preview card component</title>
    <link
      rel="shortcut icon"
      href="images/icons8-nft-100.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <div class="container">
      <div class="img-container"></div>
      <div class="description"></div>
      <div class="text-description">
        <h3 class="title">Equilibrium #3429</h3>
        <p class="about">
          Our Equilibrium collection promotes balance and calm.
        </p>
        <div class="about-container">
          <img src="images/icon-ethereum.svg" alt="ethereum" class="ethereum" />
          <p class="about-ethereum">0.041 ETH</p>
          <img src="images/icon-clock.svg" alt="clock" class="clock" />
          <p class="about-clock">3 days left</p>
        </div>
        <hr />
        <div class="about-image" id="name">
          <img src="images/image-avatar.png" alt="foto do cara" class="image" />
          <p>Creation of <a href="#">Jules Wyvern</a></p>
        </div>
      </div>
    </div>
  </body>
</html>
